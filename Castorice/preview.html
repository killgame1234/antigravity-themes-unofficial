<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Castorice 3D Wallpaper Preview</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .hud {
      position: fixed;
      bottom: 16px;
      left: 16px;
      z-index: 10;
      padding: 8px 14px;
      border-radius: 10px;
      background: rgba(11, 8, 22, 0.68);
      border: 1px solid rgba(180, 130, 255, 0.3);
      color: #e9ddff;
      font-size: 13px;
      backdrop-filter: blur(8px);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="hud">Drag to orbit · Scroll to zoom · Double-click to reset · Move mouse for parallax</div>
  <script src="./assets/three.bundle.js"></script>
  <script src="./assets/castorice_scene.js"></script>
  <script>
    window.initCastorice3D({
      container: document.body,
      layers: {
        ambient: './assets/layers/layer_ambient.jpg',
        depthMap: './assets/layers/layer_depth_5zone.jpg',
        butterflyWing: './assets/layers/butterfly_wing.webp'
      },
      videoLayers: {
        master: './assets/layers/vid_master.webm'
      },
      interactiveAlways: true,
      sidebarAware: false
    });
  </script>
</body>
</html>
